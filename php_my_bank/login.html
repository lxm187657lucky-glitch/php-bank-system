<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟银行 - 安全数字登录门户</title>
    <style>
        /* 基础样式重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f7f6; overflow: hidden; }

        /* 左侧金融氛围科技 Banner 区域 */
        .banner-side {
            flex: 1.2;
            background: linear-gradient(135deg, #0d1b2a, #1b263b, #415a77);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            color: white;
            position: relative;
        }
        .banner-side::after {
            content: ''; position: absolute; width: 300px; height: 300px; 
            background: rgba(33, 150, 243, 0.15); filter: blur(80px); border-radius: 50%; top: 10%; left: 10%;
        }
        .banner-title { font-size: 42px; font-weight: 700; margin-bottom: 20px; letter-spacing: 2px; line-height: 1.3; }
        .banner-title span { color: #2196F3; }
        .banner-desc { font-size: 16px; color: #e0e1dd; line-height: 1.8; max-width: 500px; opacity: 0.9; }
        .banner-footer { margin-top: 100px; font-size: 13px; color: #8d99ae; }

        /* 右侧清爽登录卡片区域 */
        .login-side {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.03);
        }
        .login-box { width: 100%; max-width: 400px; padding: 40px; }
        .login-header { margin-bottom: 35px; }
        .login-header h2 { font-size: 28px; color: #1b263b; margin-bottom: 8px; font-weight: 600; }
        .login-header p { font-size: 14px; color: #777; }

        /* 表单样式与动效 */
        .input-group { position: relative; margin-bottom: 25px; }
        .input-group label { display: block; font-size: 13px; color: #415a77; font-weight: 600; margin-bottom: 8px; }
        .input-group input {
            width: 100%; padding: 12px 16px; border: 2px solid #e0e1dd; border-radius: 8px;
            font-size: 15px; color: #1b263b; transition: all 0.3s ease; background-color: #fafafa;
        }
        /* 输入框聚焦变蓝发光 */
        .input-group input:focus {
            border-color: #2196F3; background-color: #fff; outline: none;
            box-shadow: 0 0 12px rgba(33, 150, 243, 0.15);
        }

        /* 辅助选项（忘记密码、注册等伪链接，增强真实感） */
        .options-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; font-size: 13px; }
        .options-bar label { color: #666; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .options-bar a { color: #2196F3; text-decoration: none; font-weight: 500; }
        .options-bar a:hover { text-decoration: underline; }

        /* 登录按钮的高级渐变与悬浮微动效 */
        .login-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #2196F3, #1E88E5);
            color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3); transition: all 0.2s ease;
        }
        .login-btn:hover {
            transform: translateY(-2px); box-shadow: 0 6px 20px rgba(33, 150, 243, 0.5);
        }
        .login-btn:active { transform: translateY(0); }

        /* 响应式适配：手机端自动隐藏左侧 */
        @media (max-width: 850px) {
            .banner-side { display: none; }
            .login-side { box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="banner-side">
        <h1 class="banner-title">新一代<br><span>分布式虚拟银行</span><br>核心业务系统</h1>
        <p class="banner-desc">基于全栈数据闭环构建，融合高强度 Session 态势感知与业界标准加密验证算法。全链路数字资产可视化大盘，为合规业务演练提供敏捷支持。</p>
        <div class="banner-footer">
            <p>© 2026 虚拟银行核心系统测试平台. All rights reserved.</p>
        </div>
    </div>

    <div class="login-side">
        <div class="login-box">
            <div class="login-header">
                <h2>🔐 安全登录</h2>
                <p>请输入您的平台凭证以访问核心数据大盘</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">👤 账户名 / 客户编号</label>
                    <input type="text" id="username" placeholder="请输入您的登录账号" value="zhangsan" required>
                </div>

                <div class="input-group">
                    <label for="password">🔑 核心交易密码</label>
                    <input type="password" id="password" placeholder="请输入您的密码" value="123456" required>
                </div>

                <div class="options-bar">
                    <label><input type="checkbox" checked> 记住此卡号</label>
                    <a href="register.html">申请数字开户?</a>
                </div>

                <button type="button" id="loginBtn" class="login-btn">安全验证并登录</button>
            </form>
        </div>
    </div>

    <script>
        // 保持你之前完全调通的完美登录 JS 逻辑，一字未改！
        document.getElementById('loginBtn').addEventListener('click', function() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            fetch('login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    // 完美承接：登录成功后，跳转到我们刚刚打通的漂亮大盘 dashboard.html
                    window.location.href = 'dashboard.html';
                } else {
                    alert('❌ 登录失败：' + data.message);
                }
            })
            .catch(err => {
                alert('⚠️ 服务器响应异常');
            });
        });
    </script>
</body>
</html>
